<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>1C Мобильный Клиент</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- PRINT RECEIPT CONTAINER (Hidden on screen) -->
  <div id="receipt-container"></div>

  <!-- APP INTERFACE -->
  <div id="app-interface">

    <!-- HEADER -->
    <header class="top-bar">
      <div>
        <div class="subtitle">Рабочее место:</div>
        <div class="title" id="adminName">Менеджер</div>
      </div>
      <div id="syncStatus" class="status-badge success">● Связь с 1С</div>
    </header>

    <!-- SETTINGS / SYNC VIEW -->
    <div id="settings-view" class="view hidden">
      <div class="card">
        <h3>📂 Обмен с 1С (Файлы)</h3>

        <div class="form-group">
          <label>1. Загрузить Клиентов (JSON/CSV)</label>
          <input type="file" id="importClients" accept=".json,.csv" onchange="app.sync.importClients(this)">
        </div>

        <div class="form-group">
          <label>2. Загрузить Товары (JSON/CSV)</label>
          <input type="file" id="importProducts" accept=".json,.csv" onchange="app.sync.importProducts(this)">
        </div>

        <hr style="border:0; border-top:1px solid #333; margin: 20px 0">

        <label>3. Выгрузить Заказы</label>
        <button class="btn-primary full-width" onclick="app.sync.exportOrders()">📤 Скачать orders.json</button>
        <p style="font-size:10px; color:#888; margin-top:5px">Отправьте этот файл в 1С</p>
      </div>

      <div class="card">
        <button class="btn-secondary full-width" style="color:red; border-color:red"
          onclick="localStorage.clear(); location.reload()">⚠️ Сброс данных</button>
      </div>
    </div>

    <!-- NEW ORDER MODAL (Full Screen) -->
    <div id="orderModal" class="modal hidden">
      <div class="modal-header">
        <h3>Новый Заказ</h3>
        <button class="close-btn" onclick="app.ui.closeOrder()">✕</button>
      </div>

      <div class="modal-body">
        <!-- Step 1: Client -->
        <div class="form-group relative">
          <label>Клиент</label>
          <input id="clientSearch" type="text" placeholder="Введите имя..." oninput="app.search.client(this.value)"
            autocomplete="off">
          <div id="clientResults" class="autocomplete-results hidden"></div>
        </div>

        <!-- Step 2: Products Table -->
        <div class="order-table-wrapper">
          <table class="order-table">
            <thead>
              <tr>
                <th style="width: 40%">Товар</th>
                <th style="width: 20%">Кол</th>
                <th style="width: 30%">Цена</th>
                <th style="width: 10%"></th>
              </tr>
            </thead>
            <tbody id="orderTableBody">
              <!-- Rows -->
            </tbody>
          </table>
          <div id="emptyState" class="empty-state">Товары не выбраны</div>
        </div>

        <!-- Step 3: Product Search (Bottom) -->
        <div class="product-add-section">
          <div class="form-group relative">
            <input id="productSearch" type="text" placeholder="+ Добавить товар (поиск)"
              oninput="app.search.product(this.value)" autocomplete="off">
            <div id="productResults" class="autocomplete-results bottom-up hidden"></div>
          </div>
        </div>

        <!-- Totals -->
        <div class="total-section">
          <div class="flex-between">
            <span>Итого:</span>
            <span id="orderTotal" class="total-price">0 UZS</span>
          </div>
        </div>

        <div class="action-buttons">
          <button class="btn-secondary" onclick="app.order.printCurrent()">🖨 Печать</button>
          <button class="btn-primary" onclick="app.order.save()">💾 Сохранить</button>
        </div>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="app.views.home()">
        <span>🏠</span>
        <span>Главная</span>
      </button>

      <!-- CENTRAL FAB -->
      <div class="fab-container" onclick="app.ui.openNewOrder()">
        <div class="fab">+</div>
      </div>

      <button class="nav-item" onclick="app.views.history()">
        <span>📄</span>
        <span>История</span>
      </button>

      <button class="nav-item" onclick="app.views.settings()">
        <span>⚙️</span>
        <span>Настр.</span>
      </button>
    </nav>

  </div>

  <script src="app.js"></script>
</body>

</html>
